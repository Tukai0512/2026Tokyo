<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>2026 東京行</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#121212">
    <meta name="format-detection" content="telephone=no">

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    
    <script>
        window.onerror = function(msg, url, line) {
            console.error("Error: " + msg + " at line " + line);
            const mask = document.getElementById('loading-mask');
            if(mask) mask.style.display = 'none';
        };
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBWoyXsYdBpI24ln_Y-5o_p28OPdPL8qvw",
            authDomain: "tokyo-eff7c.firebaseapp.com",
            projectId: "tokyo-eff7c",
            storageBucket: "tokyo-eff7c.firebasestorage.app",
            messagingSenderId: "531061949538",
            appId: "1:531061949538:web:8c5e7c3eb1b8113f747d3b",
            measurementId: "G-15QVTWMTYR"
        };

        try {
            const app = initializeApp(firebaseConfig);
            const db = getFirestore(app);
            window.db = db; window.collection = collection; window.addDoc = addDoc;
            window.onSnapshot = onSnapshot; window.query = query; window.orderBy = orderBy;
            window.deleteDoc = deleteDoc; window.doc = doc; window.setDoc = setDoc;
            window.dispatchEvent(new Event('firebase-ready'));
        } catch (e) {
            console.error("Firebase Init Error:", e);
            window.dispatchEvent(new Event('firebase-ready'));
        }
    </script>

    <style>
        :root {
            --bg-base: #121212; --bg-card: #1E1E1E; --bg-active: #333333;
            --text-main: #FFFFFF; --text-sub: #A0A0A0; --accent: #FFFFFF;
            --green: #23A559; --gold: #E09F3E; --red: #FF453A; --divider: #2C2C2C;
            --nav-height: 60px;
            --safe-bottom: env(safe-area-inset-bottom, 20px);
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: var(--bg-base);
            color: var(--text-main); 
            margin: 0; padding: 0; 
            padding-bottom: calc(var(--nav-height) + var(--safe-bottom) + 20px);
            -webkit-user-select: none;
            overflow-x: hidden;
        }

        /* --- Header --- */
        header { 
            padding: 50px 20px 5px; position: sticky; top: 0; z-index: 50;
            background: rgba(18, 18, 18, 0.95); backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--divider);
            display: flex; justify-content: space-between; align-items: flex-start;
        }
        
        .header-left { display: flex; flex-direction: column; justify-content: center; }
        .time-box h1 { margin: 0; font-size: 32px; font-weight: 700; line-height: 1; margin-bottom: 6px; }
        .countdown-badge { font-size: 14px; font-weight: 600; color: var(--text-sub); }

        .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
        
        .user-switch-btn {
            background: var(--bg-active); border: 1px solid #444;
            padding: 6px 12px; border-radius: 20px;
            font-size: 13px; font-weight: bold; color: var(--text-main);
            display: flex; align-items: center; gap: 6px;
            cursor: pointer; transition: 0.2s;
        }
        .user-switch-btn:active { transform: scale(0.95); background: #444; }
        
        .user-dot { width: 8px; height: 8px; border-radius: 50%; transition: background 0.3s; }
        .dot-green { background: var(--green); }
        .dot-gold { background: var(--gold); }

        .weather-row { display: flex; align-items: center; gap: 8px; transform: translateY(-2px); }
        .weather-temp { font-size: 20px; font-weight: bold; }
        .weather-rain { font-size: 13px; color: #4facfe; font-weight: 500; display: flex; align-items: center; gap: 2px; }

        /* --- Scroll Menu --- */
        .scroll-menu { 
            display: flex; overflow-x: auto; padding: 15px 15px 15px; 
            background: var(--bg-base); scrollbar-width: none; 
            position: sticky; top: 90px; z-index: 40;
        }
        .scroll-menu::-webkit-scrollbar { display: none; }
        .chip {
            background: var(--bg-card); color: var(--text-sub); 
            padding: 10px 20px; border-radius: 30px;
            font-size: 14px; font-weight: 600; margin-right: 10px; 
            border: 1px solid var(--divider); white-space: nowrap; transition: 0.2s;
        }
        .chip.active { 
            background: var(--text-main); color: var(--bg-base); 
            border-color: var(--text-main); 
            box-shadow: 0 4px 12px rgba(255,255,255,0.2);
        }

        /* --- Content Area --- */
        .content-area { padding: 0 15px; min-height: 70vh; }
        
        .day-container { display: none; animation: fadeIn 0.3s; }
        .day-container.active { display: block; }

        .card { background: var(--bg-card); border-radius: 20px; padding: 24px 20px; margin-bottom: 20px; }
        h2 { font-size: 20px; margin: 0 0 20px 0; display: flex; align-items: center; color: var(--text-main); font-weight: 700; }
        h2 i { margin-right: 8px; font-size: 22px; }
        
        .item-row { display: flex; flex-direction: column; margin-bottom: 25px; padding-left: 20px; border-left: 2px solid var(--divider); position: relative; }
        .item-row:last-child { margin-bottom: 0; border-left: 2px solid transparent; }
        .item-row::before { content: ''; position: absolute; left: -6px; top: 7px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px rgba(255,255,255,0.3); }
        .item-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .time-badge { color: var(--accent); font-size: 15px; font-weight: 700; margin-bottom: 4px; line-height: 1.2; }
        .btn-delete-event { background: transparent; color: #555; border: none; padding: 5px; cursor: pointer; transition: color 0.2s; }
        .btn-delete-event:active { color: var(--red); }
        .item-content { flex: 1; display: flex; flex-direction: column; }
        .item-title-link { font-weight: 700; font-size: 17px; display: block; color: var(--text-main); text-decoration: none; margin-bottom: 6px; }
        .editable-desc { font-size: 14px; color: var(--text-sub); line-height: 1.6; white-space: pre-wrap; cursor: pointer; padding: 4px 0; border-bottom: 1px dashed transparent; }
        
        /* --- 記帳 --- */
        .bill-input { width: 100%; padding: 16px; border: none; background: #2C2C2C; color: white; border-radius: 16px; font-size: 20px; margin-bottom: 12px; text-align: center; font-weight: bold; }
        .category-group { display: flex; gap: 10px; margin-bottom: 25px; overflow-x: auto; padding-bottom: 5px; justify-content: center; }
        .cat-btn { background: #2C2C2C; color: var(--text-sub); border: none; padding: 10px 20px; border-radius: 25px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: 0.2s; display: flex; align-items: center; gap: 6px; }
        .cat-btn.selected { background: var(--text-main); color: var(--bg-base); }

        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .action-btn { padding: 16px; border: none; border-radius: 16px; font-weight: bold; font-size: 15px; cursor: pointer; color: white; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .action-btn span { font-size: 11px; opacity: 0.7; font-weight: normal; }
        .btn-tukai { background: var(--green); }
        .btn-yuan { background: var(--gold); color: black; }
        
        .bill-list { list-style: none; padding: 0; margin: 0; }
        .bill-item { display: flex; align-items: center; justify-content: space-between; padding: 18px 0; border-bottom: 1px solid var(--divider); }
        .bill-left { display: flex; align-items: center; flex: 1; overflow: hidden; gap: 12px; }
        .bill-icon { width: 36px; height: 36px; border-radius: 50%; background: #2C2C2C; color: var(--text-main); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .bill-info-box { display: flex; flex-direction: column; overflow: hidden; margin-left: 12px; flex: 1; }
        .bill-desc-text { font-size: 16px; color: var(--text-main); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .bill-meta { font-size: 12px; color: #666; margin-top: 2px; }
        .bill-amount { font-weight: 700; font-size: 18px; color: var(--text-main); white-space: nowrap; }
        .btn-del { background: transparent; color: #666; border: none; padding: 8px; font-size: 16px; }

        .stats-box { background: #2B2D31; padding: 15px; border-radius: 12px; margin-top: 15px; margin-bottom: 30px; }
        .summary-box { background: #2B2D31; padding: 15px; border-radius: 12px; margin-bottom: 30px; text-align: center; }
        .summary-big { font-size: 28px; font-weight: 800; color: var(--text-main); margin-top: 5px; }
        .stats-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 10px; color: var(--text-sub); align-items: center; }
        .stats-label { display: flex; align-items: center; gap: 8px; }
        .stats-row span:last-child { color: var(--text-main); font-weight: bold; }

        /* --- 底部導航 --- */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; width: 100%; background: rgba(18, 18, 18, 0.95); backdrop-filter: blur(20px); border-top: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center; padding: 10px 20px calc(15px + var(--safe-bottom)) 20px; z-index: 100; }
        .nav-btn { border: none; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #555; font-size: 10px; font-weight: 500; flex: 1; transition: 0.2s; }
        .nav-btn i { font-size: 24px; margin-bottom: 4px; }
        .nav-btn.active { color: #FFFFFF; }

        .view-section { display: none; animation: fadeIn 0.3s; }
        .view-section.active { display: block !important; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        #loading-mask { position: fixed; top:0; left:0; width:100%; height:100%; background: var(--bg-base); z-index:999; display:flex; justify-content:center; align-items:center; color: var(--text-sub); flex-direction: column; transition: opacity 0.5s; }

        /* FAB & Modals */
        .fab-btn { position: fixed; bottom: calc(80px + var(--safe-bottom)); right: 20px; width: 56px; height: 56px; background: var(--text-main); color: black; border-radius: 16px; display: none; justify-content: center; align-items: center; font-size: 28px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 90; border: none; cursor: pointer; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 200; justify-content: center; align-items: center; }
        .modal-content { background: #1E1E1E; width: 85%; max-width: 400px; padding: 25px; border-radius: 24px; }
        .modal-textarea, .modal-input { width: 100%; background: #2C2C2C; color: white; border: none; padding: 12px; border-radius: 10px; font-size: 16px; margin-bottom: 12px; }
        .modal-btns { display: flex; gap: 10px; }
        .modal-btn { flex: 1; padding: 12px; border-radius: 10px; border: none; font-weight: bold; font-size: 15px; }
        .btn-cancel { background: #333; color: #BBB; } .btn-save { background: white; color: black; }
        
        .check-item { display: flex; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--divider); cursor: pointer; }
        .check-item input { transform: scale(1.4); margin-right: 15px; accent-color: var(--accent); }
        .check-item span { font-size: 16px; color: var(--text-main); }
        .check-item.checked span { text-decoration: line-through; color: #5C5E66; }
    </style>
</head>
<body>

    <div id="loading-mask">
        <div style="font-size: 40px; margin-bottom: 15px;"><i class="ri-plane-fill" style="color:white;"></i></div>
        <div style="font-size: 12px; opacity: 0.5;">載入中...</div>
    </div>

    <div id="edit-modal" class="modal-overlay"><div class="modal-content"><textarea id="modal-input" class="modal-textarea" rows="5"></textarea><div class="modal-btns"><button class="modal-btn btn-cancel" onclick="closeEdit()">取消</button><button class="modal-btn btn-save" onclick="saveEdit()">儲存</button></div></div></div>
    
    <div id="add-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 style="margin-top:0; color:white; text-align:center; margin-bottom:20px;">新增行程</h3>
            <select id="add-date" class="modal-input"><option value="day1">5/17 (日)</option><option value="day2">5/18 (一)</option><option value="day3">5/19 (二)</option><option value="day4">5/20 (三)</option><option value="day5">5/21 (四)</option><option value="day6">5/22 (五)</option></select>
            <input type="text" id="add-time" class="modal-input" placeholder="時間 (如 14:00)">
            <input type="text" id="add-title" class="modal-input" placeholder="活動名稱">
            <input type="text" id="add-link" class="modal-input" placeholder="Google Maps 連結">
            <textarea id="add-desc" class="modal-textarea" style="height:80px" placeholder="備註"></textarea>
            <div class="modal-btns"><button class="modal-btn btn-cancel" onclick="closeAdd()">取消</button><button class="modal-btn btn-save" onclick="saveNewEvent()">新增</button></div>
        </div>
    </div>

    <header>
        <div class="header-left">
            <div class="time-box">
                <h1 id="date-display">--/--</h1>
                <div id="countdown" class="countdown-badge">計算中...</div>
            </div>
        </div>
        <div class="header-right">
            <button class="user-switch-btn" onclick="toggleUserIdentity()">
                <div id="user-dot" class="user-dot dot-green"></div>
                <span id="header-user-name">我是土開</span>
            </button>
            <div class="weather-row">
                <span class="weather-temp" id="weather">--°</span>
                <span class="weather-rain" id="rain-chance">💧 --%</span>
            </div>
        </div>
    </header>

    <div class="scroll-menu" id="day-tabs-container"></div>

    <div class="content-area">
        
        <div id="view-home" class="view-section active">
            <div class="card" style="text-align:center; background: linear-gradient(145deg, #2a2a2a, #1a1a1a);">
                <div style="font-size:14px; color:#888; margin-bottom:10px;">目前東京天氣</div>
                <div style="display:flex; justify-content:center; align-items:center; gap:15px;">
                    <i class="ri-sun-cloudy-fill" style="font-size:48px; color:white;"></i>
                    <div id="home-temp" style="font-size:48px; font-weight:900;">--°</div>
                </div>
                <div id="home-rain" style="color:#4facfe; margin-top:10px; font-size:14px; background: rgba(79, 172, 254, 0.1); padding: 4px 12px; border-radius: 20px; display: inline-block;">降雨機率 --%</div>
            </div>
            <div class="card" style="border-left: 4px solid white;">
                <div style="font-size:12px; color:#888; margin-bottom:5px; text-transform: uppercase; letter-spacing: 1px;">現在狀態</div>
                <div style="font-size:20px; font-weight:bold; color:white;" id="now-event-title">準備出發</div>
                <div style="font-size:14px; color:var(--green); margin-top:5px;" id="now-event-time">--:--</div>
            </div>
            <div class="card" style="opacity: 0.7;">
                <div style="font-size:12px; color:#888; margin-bottom:5px; text-transform: uppercase; letter-spacing: 1px;">下一個行程</div>
                <div style="font-size:16px; font-weight:bold; color:white;" id="next-event-title">抵達成田機場</div>
                <div style="font-size:14px; color:#aaa; margin-top:5px;" id="next-event-time">5/17 15:20</div>
            </div>
        </div>

        <div id="view-schedule" class="view-section">
            <div id="schedule-container"></div>
            <button class="fab-btn" id="fab-add" onclick="openAdd()"><i class="ri-add-line"></i></button>
        </div>

        <div id="view-money" class="view-section">
            <div id="sub-split" class="sub-view active">
                <div class="card">
                    <h2><i class="ri-group-fill"></i> 公款分帳</h2>
                    <input type="text" id="splitDesc" class="bill-input" placeholder="項目名稱">
                    <input type="number" id="splitAmount" class="bill-input" placeholder="¥ 金額">
                    <div class="category-group" id="splitCats">
                        <button class="cat-btn" onclick="selectCat('split', '飲食')"><i class="ri-restaurant-line"></i> 飲食</button>
                        <button class="cat-btn" onclick="selectCat('split', '交通')"><i class="ri-bus-line"></i> 交通</button>
                        <button class="cat-btn" onclick="selectCat('split', '購物')"><i class="ri-shopping-bag-3-line"></i> 購物</button>
                        <button class="cat-btn selected" onclick="selectCat('split', '其他')"><i class="ri-box-3-line"></i> 其他</button>
                    </div>
                    <div class="btn-grid">
                        <button class="action-btn btn-tukai" onclick="addSplit('TukaiAll')">土開 付全額<span>(均分)</span></button>
                        <button class="action-btn btn-yuan" onclick="addSplit('YuanAll')">元戎 付全額<span>(均分)</span></button>
                        <button class="action-btn" style="background:#333" onclick="addSplit('TukaiHelp')">土開 幫墊<span>(對方還)</span></button>
                        <button class="action-btn" style="background:#333" onclick="addSplit('YuanHelp')">元戎 幫墊<span>(我還)</span></button>
                    </div>
                </div>
                <div class="summary-box">
                    <div style="font-size:12px; color:#888; margin-bottom:5px;">結算結果 (正=元戎給土開)</div>
                    <div class="summary-big" id="splitResult">計算中...</div>
                </div>
                <div class="card"><ul class="bill-list" id="splitList"></ul></div>
            </div>

            <div id="sub-wallet" class="sub-view">
                <div class="card">
                    <h2 id="wallet-title"><i class="ri-wallet-3-fill"></i> 我的錢包</h2>
                    <input type="text" id="personalDesc" class="bill-input" placeholder="個人消費項目">
                    <input type="number" id="personalAmount" class="bill-input" placeholder="¥ 金額">
                    <div class="category-group" id="personalCats">
                        <button class="cat-btn" onclick="selectCat('personal', '飲食')"><i class="ri-restaurant-line"></i> 飲食</button>
                        <button class="cat-btn" onclick="selectCat('personal', '交通')"><i class="ri-bus-line"></i> 交通</button>
                        <button class="cat-btn" onclick="selectCat('personal', '購物')"><i class="ri-shopping-bag-3-line"></i> 購物</button>
                        <button class="cat-btn selected" onclick="selectCat('personal', '其他')"><i class="ri-box-3-line"></i> 其他</button>
                    </div>
                    <button class="action-btn" style="width:100%; background:white; color:black;" onclick="addPersonal()">加入個人記帳</button>
                </div>
                <div class="stats-box" id="statsBox"></div>
                <div class="summary-box"><div style="font-size:12px; color:#888; margin-bottom:5px;">我的總花費</div><div class="summary-big" id="personalResult">¥ 0</div></div>
                <div class="card"><ul class="bill-list" id="personalList"></ul></div>
            </div>
        </div>

        <div id="view-list" class="view-section">
            <div class="card"><h2><i class="ri-checkbox-multiple-fill"></i> 出發前檢查</h2><div id="checklist-container"></div></div>
        </div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-btn active" onclick="switchTab('home')"><i class="ri-home-5-line"></i><span>首頁</span></button>
        <button class="nav-btn" onclick="switchTab('schedule')"><i class="ri-map-2-line"></i><span>行程</span></button>
        <button class="nav-btn" onclick="switchTab('money')"><i class="ri-money-cny-circle-line"></i><span>記帳</span></button>
        <button class="nav-btn" onclick="switchTab('list')"><i class="ri-suitcase-line"></i><span>清單</span></button>
    </nav>

    <script>
        // --- 核心資料 (預設行程) ---
        const scheduleData = [
            { id: 'day1', date: '5/17 (日)', events: [
                { time: '15:20', title: '抵達成田機場', link: 'https://www.google.com/maps/search/?api=1&query=成田國際機場', desc: '• 入境檢查\n• 領取行李\n• 購買 Skyliner 車票' },
                { time: '18:00', title: 'Check-in 上野飯店', link: 'https://www.google.com/maps/search/?api=1&query=上野車站', desc: '• 搭乘 Skyliner 直達上野\n• 先放行李' }
            ]},
            { id: 'day2', date: '5/18 (一)', events: [] },
            { id: 'day3', date: '5/19 (二)', events: [
                { time: '全天', title: '市區探索', link: '', desc: '• 澀谷 Sky 觀景台\n• 新宿逛街' }
            ]},
            { id: 'day4', date: '5/20 (三)', events: [
                { time: '09:00', title: '鎌倉高校前', link: 'https://www.google.com/maps/search/?api=1&query=鎌倉高校前駅', desc: '• 灌籃高手平交道拍照\n• 吃吻仔魚丼' }
            ]},
            { id: 'day5', date: '5/21 (四)', events: [
                { time: '全天', title: '最後採買', link: '', desc: '• 淺草雷門\n• 晴空塔\n• 藥妝補貨' }
            ]},
            { id: 'day6', date: '5/22 (五)', events: [
                { time: '13:30', title: '出發去機場', link: 'https://www.google.com/maps/search/?api=1&query=上野車站', desc: '• 搭乘 Skyliner\n• 預留 2 小時 Check-in' }
            ]}
        ];

        let db, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc, setDoc;
        let currentUser = localStorage.getItem('currentUser') || 'Tukai';
        let splitLogs = [];
        let personalLogs = JSON.parse(localStorage.getItem('personalLogs')) || [];
        let hiddenDefaults = []; 
        let currentCat = { split: '其他', personal: '其他' };
        let currentEditId = null;
        let customEventsList = []; 
        let itineraryEdits = {};   

        setTimeout(() => { const m=document.getElementById('loading-mask'); if(m) m.style.opacity=0; setTimeout(()=>m.style.display='none',500); }, 3000);

        window.addEventListener('firebase-ready', () => {
            db = window.db; collection = window.collection; addDoc = window.addDoc;
            onSnapshot = window.onSnapshot; query = window.query; orderBy = window.orderBy;
            deleteDoc = window.deleteDoc; doc = window.doc; setDoc = window.setDoc;

            try {
                // 1. 記帳
                onSnapshot(query(collection(db, "splitLogs"), orderBy("timestamp", "desc")), (snapshot) => {
                    splitLogs = []; snapshot.forEach(d => splitLogs.push({ id: d.id, ...d.data() })); renderSplitUI();
                    const m=document.getElementById('loading-mask'); if(m) { m.style.opacity=0; setTimeout(()=>m.style.display='none',500); }
                });

                // 2. 預設行程修改與隱藏監聽
                onSnapshot(collection(db, "itinerary_edits"), (snapshot) => {
                    snapshot.forEach(d => {
                        const data = d.data();
                        if (data.hidden) {
                            if (!hiddenDefaults.includes(d.id)) hiddenDefaults.push(d.id);
                        } else {
                            itineraryEdits[d.id] = data.text;
                        }
                    });
                    renderSchedule(); // 同步後重新排序渲染
                });

                // 3. 自定義行程監聽
                onSnapshot(collection(db, "custom_events"), (snap) => {
                    customEventsList = [];
                    snap.forEach(d => customEventsList.push({ id: d.id, ...d.data() }));
                    renderSchedule(); // 同步後重新排序渲染
                });
            } catch (err) { console.error(err); }
        });

        document.addEventListener('DOMContentLoaded', () => {
            renderSchedule(); renderChecklist(); updateClock(); setInterval(updateClock, 1000); getWeather(); updateUserUI(); switchTab('home');
        });

        // 解析時間以利排序 (全天放最前，待定放最後)
        function parseTime(timeStr) {
            if (!timeStr) return 9999;
            if (timeStr.includes('全天')) return -1;
            if (timeStr.includes('待定')) return 9999;
            const match = timeStr.match(/(\d{1,2}):(\d{2})/);
            if (match) {
                return parseInt(match[1]) * 60 + parseInt(match[2]);
            }
            return 9999;
        }

        // --- 自動排序與整合渲染 ---
        function renderSchedule() {
            const tabsContainer = document.getElementById('day-tabs-container');
            const container = document.getElementById('schedule-container');
            
            // 記住現在選中的天數 (避免更新時畫面跳回第一天)
            let activeDayId = 'day1';
            const currentActive = document.querySelector('.day-container.active');
            if (currentActive) activeDayId = currentActive.id.replace('view-', '');

            tabsContainer.innerHTML = '<div class="scroll-menu" id="day-tabs"></div>';
            const tabs = document.getElementById('day-tabs');
            container.innerHTML = '';

            scheduleData.forEach((day, index) => {
                const isActive = day.id === activeDayId;
                
                const chip = document.createElement('button');
                chip.className = `chip ${isActive ? 'active' : ''}`;
                chip.innerText = day.date.split(' ')[0];
                chip.onclick = () => {
                    document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
                    chip.classList.add('active');
                    document.querySelectorAll('.day-container').forEach(d=>d.classList.remove('active'));
                    document.getElementById(`view-${day.id}`).classList.add('active');
                };
                tabs.appendChild(chip);

                const dayDiv = document.createElement('div');
                dayDiv.id = `view-${day.id}`; 
                dayDiv.className = `day-container ${isActive ? 'active' : ''}`;
                
                let combinedEvents = [];

                // 加入預設行程
                day.events.forEach((evt, i) => {
                    const editId = `${day.id}_e${i}`;
                    if (hiddenDefaults.includes(editId)) return;
                    
                    const descText = itineraryEdits[editId] !== undefined ? itineraryEdits[editId] : evt.desc;
                    
                    combinedEvents.push({
                        isDefault: true,
                        id: editId,
                        time: evt.time,
                        title: evt.title,
                        link: evt.link,
                        desc: descText,
                        sortTime: parseTime(evt.time)
                    });
                });

                // 加入自訂行程
                customEventsList.filter(e => e.dayId === day.id).forEach(evt => {
                    combinedEvents.push({
                        isDefault: false,
                        id: evt.id,
                        time: evt.time,
                        title: evt.title,
                        link: evt.link,
                        desc: evt.desc || '',
                        sortTime: parseTime(evt.time)
                    });
                });

                // 依照時間排序 (早到晚)
                combinedEvents.sort((a, b) => a.sortTime - b.sortTime);

                let eventsHtml = '';
                combinedEvents.forEach(evt => {
                    const linkHtml = evt.link ? `<a href="${evt.link}" class="item-title-link" target="_blank">${evt.title}</a>` : `<span class="item-title-link">${evt.title}</span>`;
                    eventsHtml += `
                    <div class="item-row">
                        <div class="item-header">
                            <div class="time-badge">${evt.time}</div>
                            <button class="btn-delete-event" onclick="deleteEvent('${evt.id}', ${evt.isDefault})"><i class="ri-delete-bin-line"></i></button>
                        </div>
                        <div class="item-content">
                            ${linkHtml}
                            <div class="editable-desc" onclick="openEdit(this, '${evt.id}')">${evt.desc.replace(/\n/g, '<br>')}</div>
                        </div>
                    </div>`;
                });

                dayDiv.innerHTML = `<div class="card"><h2><i class="ri-calendar-event-fill"></i> ${day.date}</h2>${eventsHtml}</div>`;
                container.appendChild(dayDiv);
            });
        }

        async function deleteEvent(id, isDefault) {
            if (!confirm("確定要刪除此行程嗎？(雙方手機都會同步移除)")) return;
            
            // 本機先處理，讓畫面即時反應
            if (isDefault) { hiddenDefaults.push(id); } else { customEventsList = customEventsList.filter(e => e.id !== id); }
            renderSchedule();

            try {
                if (isDefault) { await setDoc(doc(db, "itinerary_edits", id), { hidden: true }, { merge: true }); } 
                else { await deleteDoc(doc(db, "custom_events", id)); }
            } catch (e) { alert("刪除失敗"); }
        }

        function toggleUserIdentity() { currentUser = currentUser === 'Tukai' ? 'Yuan' : 'Tukai'; localStorage.setItem('currentUser', currentUser); updateUserUI(); renderPersonalUI(); }
        function updateUserUI() { const btnText = document.getElementById('header-user-name'); const btnDot = document.getElementById('user-dot'); btnText.innerText = currentUser === 'Tukai' ? '我是土開' : '我是元戎'; btnDot.className = `user-dot ${currentUser==='Tukai'?'dot-green':'dot-gold'}`; document.getElementById('wallet-title').innerHTML = `<i class="ri-wallet-3-fill"></i> ${currentUser==='Tukai'?'土開':'元戎'}的錢包`; }
        function switchTab(tab) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.nav-btn i').forEach(i => i.className = i.className.replace('-fill','-line'));
            const targetBtn = document.querySelector(`.nav-btn[onclick="switchTab('${tab}')"]`);
            if(targetBtn) { targetBtn.classList.add('active'); targetBtn.querySelector('i').className = targetBtn.querySelector('i').className.replace('-line','-fill'); }
            document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
            document.getElementById(`view-${tab}`).classList.add('active');
            if(tab==='money') { document.getElementById('sub-split').classList.add('active'); document.getElementById('sub-wallet').classList.add('active'); }
            document.getElementById('fab-add').style.display = tab==='schedule' ? 'flex' : 'none';
        }

        function renderSplitUI() {
            const list = document.getElementById('splitList'); list.innerHTML = ''; let debt = 0;
            splitLogs.forEach(log => {
                if (log.type === 'TukaiAll') debt += (log.amount/2); if (log.type === 'YuanAll') debt -= (log.amount/2); if (log.type === 'TukaiHelp') debt += log.amount; if (log.type === 'YuanHelp') debt -= log.amount;
                const icon = {'飲食':'ri-restaurant-line','交通':'ri-bus-line','購物':'ri-shopping-bag-3-line','其他':'ri-box-3-line'}[log.cat] || 'ri-money-cny-circle-line';
                list.innerHTML += `<li class="bill-item"><div class="bill-left"><div class="bill-icon"><i class="${icon}"></i></div><div class="bill-info-box"><div class="bill-desc-text">${log.desc}</div><div class="bill-meta">${log.time} · ${log.type.includes('Tukai')?'土開':'元戎'}付</div></div></div><div class="bill-right"><div class="bill-amount">¥${log.amount}</div><button class="btn-del" onclick="deleteSplit('${log.id}')"><i class="ri-delete-bin-line"></i></button></div></li>`;
            });
            const res = document.getElementById('splitResult');
            if(debt > 0) res.innerText = `元戎 給 土開 ¥${Math.ceil(debt)}`; else if(debt < 0) res.innerText = `土開 給 元戎 ¥${Math.ceil(Math.abs(debt))}`; else res.innerText = "目前結清";
            renderPersonalUI();
        }

        function renderPersonalUI() {
            const list = document.getElementById('personalList'); list.innerHTML = ''; const statsBox = document.getElementById('statsBox'); let total = 0; let stats = { '飲食':0, '交通':0, '購物':0, '其他':0 };
            let myLogs = [...personalLogs];
            splitLogs.forEach(log => {
                let myShare = 0;
                if (currentUser === 'Tukai') { if (log.type === 'TukaiAll' || log.type === 'YuanAll') myShare = log.amount/2; else if (log.type === 'YuanHelp') myShare = log.amount; }
                else { if (log.type === 'TukaiAll' || log.type === 'YuanAll') myShare = log.amount/2; else if (log.type === 'TukaiHelp') myShare = log.amount; }
                if (myShare > 0) myLogs.push({ desc: `(公) ${log.desc}`, amount: myShare, cat: log.cat, time: log.time, isCloud: true });
            });
            myLogs.sort((a,b) => b.time > a.time ? 1 : -1);
            myLogs.forEach((log, idx) => {
                total += log.amount; let c = log.cat || '其他'; if(stats[c]===undefined) stats['其他'] += log.amount; else stats[c] += log.amount;
                const icon = {'飲食':'ri-restaurant-line','交通':'ri-bus-line','購物':'ri-shopping-bag-3-line','其他':'ri-box-3-line'}[log.cat] || 'ri-money-cny-circle-line';
                list.innerHTML += `<li class="bill-item"><div class="bill-left"><div class="bill-icon"><i class="${icon}"></i></div><div class="bill-info-box"><div class="bill-desc-text">${log.desc}</div><div class="bill-meta">${log.time}</div></div></div><div class="bill-right"><div class="bill-amount">¥${log.amount}</div>${log.isCloud?'':`<button class="btn-del" onclick="deletePersonal(${idx})"><i class="ri-delete-bin-line"></i></button>`}</div></li>`;
            });
            document.getElementById('personalResult').innerText = `¥ ${Math.ceil(total)}`;
            statsBox.innerHTML = `<div style="font-size:13px; font-weight:bold; margin-bottom:15px; color:#888;">消費統計</div>` + Object.keys(stats).map(k => `<div class="stats-row"><div class="stats-label"><i class="${{'飲食':'ri-restaurant-line','交通':'ri-bus-line','購物':'ri-shopping-bag-3-line','其他':'ri-box-3-line'}[k]}"></i><span>${k}</span></div><span>¥${stats[k]}</span></div>`).join('');
        }

        function selectCat(t, c) { currentCat[t] = c; const group = document.getElementById(t+'Cats'); Array.from(group.children).forEach(b => b.classList.toggle('selected', b.innerText.includes(c))); }
        async function addSplit(type) { if(!db) return; const desc = document.getElementById('splitDesc').value; const amount = parseInt(document.getElementById('splitAmount').value); if(!desc || !amount) return; await addDoc(collection(db, "splitLogs"), { desc, amount, type, cat: currentCat.split, time: new Date().toLocaleString('zh-TW', {hour12:false, month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'}), timestamp: new Date() }); document.getElementById('splitDesc').value=''; document.getElementById('splitAmount').value=''; }
        async function deleteSplit(id) { if(confirm("刪除？")) await deleteDoc(doc(db, "splitLogs", id)); }
        function addPersonal() { const desc = document.getElementById('personalDesc').value; const amount = parseInt(document.getElementById('personalAmount').value); if(!desc || !amount) return; personalLogs.unshift({ desc, amount, cat: currentCat.personal, time: new Date().toLocaleString('zh-TW', {hour12:false, month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'}) }); localStorage.setItem('personalLogs', JSON.stringify(personalLogs)); renderPersonalUI(); document.getElementById('personalDesc').value=''; document.getElementById('personalAmount').value=''; }
        function deletePersonal(i) { if(confirm("刪除？")) { personalLogs.splice(i, 1); localStorage.setItem('personalLogs', JSON.stringify(personalLogs)); renderPersonalUI(); } }
        function renderChecklist() { const c = document.getElementById('checklist-container'); const items = ["護照", "VJW 截圖", "網卡/eSIM", "日幣現金", "行動電源", "充電線", "牙刷/牙膏", "常備藥"]; const saved = JSON.parse(localStorage.getItem('checklistState')) || {}; c.innerHTML = items.map(i => `<label class="check-item ${saved[i]?'checked':''}" onclick="toggleCheck(this,'${i}')"><input type="checkbox" ${saved[i]?'checked':''}><span>${i}</span></label>`).join(''); }
        function toggleCheck(el, i) { const cb = el.querySelector('input'); if(event.target!==cb) cb.checked=!cb.checked; el.classList.toggle('checked', cb.checked); const s = JSON.parse(localStorage.getItem('checklistState'))||{}; s[i]=cb.checked; localStorage.setItem('checklistState', JSON.stringify(s)); }
        function updateClock() { const now = new Date(); const tripDate = new Date('2026-05-17T00:00:00'); document.getElementById('date-display').innerText = now.toLocaleDateString('zh-TW', {month:'numeric', day:'numeric', weekday:'short'}).replace('週',''); const diff = Math.ceil((tripDate - now) / (1000*60*60*24)); document.getElementById('countdown').innerText = diff>0 ? `🇯🇵 倒數 ${diff} 天` : `🚀 東京 Day ${Math.abs(diff)+1}`; }
        function getWeather() { fetch(`https://api.open-meteo.com/v1/forecast?latitude=35.6895&longitude=139.6917&current_weather=true&hourly=precipitation_probability`).then(r=>r.json()).then(d=>{ document.getElementById('home-temp').innerText = document.getElementById('weather').innerText = Math.round(d.current_weather.temperature) + '°'; document.getElementById('home-rain').innerText = document.getElementById('rain-chance').innerText = `💧 ${d.hourly.precipitation_probability[new Date().getHours()]}%`; }); }
        
        function openEdit(el, id) { currentEditId=id; document.getElementById('modal-input').value=el.innerText.replace(/• /g,''); document.getElementById('edit-modal').style.display='flex'; }
        function closeEdit() { document.getElementById('edit-modal').style.display='none'; }
        function saveEdit() { 
            const txt = document.getElementById('modal-input').value.trim(); 
            const final = txt.split('\n').map(l=>l.trim()?(l.startsWith('•')?l:'• '+l):'').join('\n'); 
            const col = currentEditId.startsWith('day') ? "itinerary_edits" : "custom_events"; 
            const field = col==="itinerary_edits" ? "text" : "desc"; 
            
            // 本機即時更新
            if (col === "itinerary_edits") { itineraryEdits[currentEditId] = final; } 
            else { const targetEvt = customEventsList.find(e => e.id === currentEditId); if(targetEvt) targetEvt.desc = final; }
            renderSchedule();

            if(window.db) setDoc(doc(window.db, col, currentEditId), {[field]:final}, {merge:true}); 
            closeEdit(); 
        }
        
        function openAdd() { document.getElementById('add-modal').style.display='flex'; }
        function closeAdd() { document.getElementById('add-modal').style.display='none'; }
        async function saveNewEvent() { 
            const dayId = document.getElementById('add-date').value; 
            const title = document.getElementById('add-title').value; 
            if(!title) return; 
            let desc = document.getElementById('add-desc').value.trim(); 
            if(desc) desc = desc.split('\n').map(l=>l.trim().startsWith('•')?l.trim():'• '+l.trim()).join('\n'); 
            
            const newEvt = { dayId, time: document.getElementById('add-time').value||'待定', title, link: document.getElementById('add-link').value, desc, createdAt: new Date() };
            closeAdd(); 
            
            if(window.db) { await addDoc(collection(window.db, "custom_events"), newEvt); } 
            
            // 新增後自動切換到該天
            document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
            document.querySelector(`.chip[onclick*="${dayId}"]`).classList.add('active');
            document.querySelectorAll('.day-container').forEach(d=>d.classList.remove('active'));
            document.getElementById(`view-${dayId}`).classList.add('active');
        }
    </script>
</body>
</html>
